<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TrackED – Cadre aux doigts</title>
<style>
  :root { --bg:#000; --fg:#fff; --accent:#ff2d55; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; height:100%; object-fit:contain; }
  video { display:none; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:8px; overflow-x:auto; background:linear-gradient(transparent, rgba(0,0,0,.7)); }
  #ui button, #ui label { flex:0 0 auto; border:1px solid rgba(255,255,255,.4); background:rgba(0,0,0,.4);
    color:#fff; padding:10px 14px; border-radius:999px; font-size:14px; cursor:pointer; }
  #ui button.on { background:var(--accent); border-color:var(--accent); }
  #ui input[type=file] { display:none; }
  #status { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:16px; right:16px; text-align:center;
    font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px; align-items:center;
    justify-content:center; background:#000; z-index:10; padding:16px; text-align:center; }
  #start button { font-size:18px; padding:14px 28px; border-radius:999px; border:0; background:var(--accent); color:#fff; }
</style>
</head>
<body>
<div id="start">
  <h1 style="margin:0">TrackED</h1>
  <p style="max-width:340px;opacity:.8">Fais un « L » avec le pouce et l'index de chaque main, face caméra :
  un cadre filtré apparaît entre tes mains.</p>
  <button id="go">Activer la caméra</button>
</div>
<div id="stage"><canvas id="out"></canvas></div>
<video id="cam" playsinline muted></video>
<div id="status">Chargement…</div>
<div id="ui">
  <button data-fx="neon" class="on">Néon rouge</button>
  <button data-fx="violet">Violet</button>
  <button data-fx="jaune">Jaune</button>
  <button data-fx="invert">Négatif</button>
  <button data-fx="bw">N&amp;B</button>
  <button data-fx="image">Image</button>
  <label>📷 Choisir image<input id="file" type="file" accept="image/*"></label>
  <button id="flip">↺ Caméra</button>
  <button id="debug">Points</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const THUMB_TIP = 4, INDEX_TIP = 8;
const video = document.getElementById("cam");
const out = document.getElementById("out");
const ctx = out.getContext("2d", { willReadFrequently: true });
const fxCanvas = document.createElement("canvas");
const fxCtx = fxCanvas.getContext("2d", { willReadFrequently: true });
const status = document.getElementById("status");

let effect = "neon";
let facing = "user";
let showDebug = false;
let overlayImg = null;
let landmarker = null;
let smoothed = null; // smoothed quad corners
let visibility = 0;  // 0..1 fade of the frame

// ---------- UI ----------
document.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => {
  effect = b.dataset.fx;
  document.querySelectorAll("[data-fx]").forEach(x => x.classList.toggle("on", x === b));
});
document.getElementById("debug").onclick = e => { showDebug = !showDebug; e.target.classList.toggle("on", showDebug); };
document.getElementById("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCamera(); };
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { overlayImg = img; document.querySelector('[data-fx="image"]').click(); };
  img.src = URL.createObjectURL(f);
};
document.getElementById("go").onclick = async () => {
  document.getElementById("start").remove();
  await Promise.all([initModel(), startCamera()]);
  requestAnimationFrame(loop);
};

// ---------- Setup ----------
async function initModel() {
  status.textContent = "Chargement du modèle de mains…";
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
  status.textContent = "Montre tes deux mains en forme de L";
}

async function startCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
  });
  video.srcObject = stream;
  await video.play();
  out.width = video.videoWidth; out.height = video.videoHeight;
  fxCanvas.width = out.width; fxCanvas.height = out.height;
}

// ---------- Geometry ----------
// Quad between two hands: indexA -> indexB -> thumbB -> thumbA.
// Hands are ordered left-to-right on screen so the quad never self-intersects.
function quadFromHands(hands, w, h) {
  const pts = hands.map(lm => ({
    index: { x: lm[INDEX_TIP].x * w, y: lm[INDEX_TIP].y * h },
    thumb: { x: lm[THUMB_TIP].x * w, y: lm[THUMB_TIP].y * h },
  }));
  pts.sort((a, b) => (a.index.x + a.thumb.x) - (b.index.x + b.thumb.x));
  const [A, B] = pts;
  let q = [A.index, B.index, B.thumb, A.thumb];
  // if the diagonals don't cross, the quad is twisted: swap B's corners
  if (!segmentsIntersect(q[0], q[2], q[1], q[3])) q = [A.index, B.thumb, B.index, A.thumb];
  return q;
}
function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }
function segmentsIntersect(p1, p2, p3, p4) {
  const d1 = cross(p3, p4, p1), d2 = cross(p3, p4, p2), d3 = cross(p1, p2, p3), d4 = cross(p1, p2, p4);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}
function lerpQuad(prev, next, t) {
  if (!prev) return next.map(p => ({ ...p }));
  return prev.map((p, i) => ({ x: p.x + (next[i].x - p.x) * t, y: p.y + (next[i].y - p.y) * t }));
}
function quadBounds(q, w, h) {
  const xs = q.map(p => p.x), ys = q.map(p => p.y);
  const x0 = Math.max(0, Math.floor(Math.min(...xs))), y0 = Math.max(0, Math.floor(Math.min(...ys)));
  const x1 = Math.min(w, Math.ceil(Math.max(...xs))), y1 = Math.min(h, Math.ceil(Math.max(...ys)));
  return { x: x0, y: y0, w: Math.max(0, x1 - x0), h: Math.max(0, y1 - y0) };
}

// ---------- Effects (pixel shaders on the CPU, only inside the frame bounds) ----------
const FX = {
  neon(d) { // red / black posterize with bright edges
    for (let i = 0; i < d.length; i += 4) {
      const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const v = l > 150 ? 255 : l > 90 ? 200 : l > 50 ? 60 : 15;
      d[i] = v; d[i + 1] = v > 200 ? 40 : 0; d[i + 2] = v > 200 ? 40 : 0;
    }
  },
  violet(d) { tint(d, [140, 40, 255]); },
  jaune(d) { tint(d, [255, 210, 30]); },
  invert(d) { for (let i = 0; i < d.length; i += 4) { d[i] = 255 - d[i]; d[i + 1] = 255 - d[i + 1]; d[i + 2] = 255 - d[i + 2]; } },
  bw(d) {
    for (let i = 0; i < d.length; i += 4) {
      const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const c = Math.min(255, Math.max(0, (l - 128) * 1.6 + 128));
      d[i] = d[i + 1] = d[i + 2] = c;
    }
  },
};
function tint(d, [r, g, b]) {
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
    d[i] = r * l * 1.3; d[i + 1] = g * l * 1.3; d[i + 2] = b * l * 1.3;
  }
}

function drawFramedEffect(q, alpha) {
  const w = out.width, h = out.height;
  const bb = quadBounds(q, w, h);
  if (bb.w < 4 || bb.h < 4) return;

  // 1. build the effect layer for the bounding box
  fxCtx.clearRect(0, 0, w, h);
  if (effect === "image") {
    // draw the camera, then the chosen image aligned with the frame (rotated rect), tinted
    fxCtx.drawImage(out, bb.x, bb.y, bb.w, bb.h, bb.x, bb.y, bb.w, bb.h);
    const img = overlayImg || placeholderImage();
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4, cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;
    const angle = Math.atan2(q[1].y - q[0].y, q[1].x - q[0].x);
    const len = Math.hypot(q[1].x - q[0].x, q[1].y - q[0].y);
    const hgt = Math.hypot(q[3].x - q[0].x, q[3].y - q[0].y);
    fxCtx.save();
    fxCtx.translate(cx, cy); fxCtx.rotate(angle);
    fxCtx.globalAlpha = 0.85;
    fxCtx.drawImage(img, -len / 2, -hgt / 2, len, hgt);
    fxCtx.restore();
    fxCtx.globalAlpha = 1;
  } else {
    const data = ctx.getImageData(bb.x, bb.y, bb.w, bb.h);
    FX[effect](data.data);
    fxCtx.putImageData(data, bb.x, bb.y);
  }

  // 2. clip to the quad and composite onto the output
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(q[0].x, q[0].y); for (let i = 1; i < 4; i++) ctx.lineTo(q[i].x, q[i].y); ctx.closePath();
  ctx.clip();
  ctx.drawImage(fxCanvas, bb.x, bb.y, bb.w, bb.h, bb.x, bb.y, bb.w, bb.h);
  ctx.restore();
}

let _ph;
function placeholderImage() {
  if (_ph) return _ph;
  _ph = document.createElement("canvas"); _ph.width = 400; _ph.height = 120;
  const c = _ph.getContext("2d");
  const g = c.createLinearGradient(0, 0, 400, 0);
  g.addColorStop(0, "#ff2d55"); g.addColorStop(1, "#5e5ce6");
  c.fillStyle = g; c.fillRect(0, 0, 400, 120);
  c.fillStyle = "#fff"; c.font = "bold 40px system-ui"; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText("Choisis une image", 200, 60);
  return _ph;
}

// ---------- Main loop ----------
let lastTs = -1;
function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  const w = out.width, h = out.height;
  const mirror = facing === "user";

  // draw the camera frame (mirrored for selfie)
  ctx.save();
  if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, w, h);
  ctx.restore();

  const ts = performance.now();
  if (ts === lastTs) return; lastTs = ts;
  const res = landmarker.detectForVideo(video, ts);
  let hands = res.landmarks || [];
  if (mirror) hands = hands.map(lm => lm.map(p => ({ ...p, x: 1 - p.x })));

  if (hands.length === 2) {
    const q = quadFromHands(hands, w, h);
    smoothed = lerpQuad(smoothed, q, 0.6);
    visibility = Math.min(1, visibility + 0.25);
    status.textContent = "";
  } else {
    visibility = Math.max(0, visibility - 0.15);
    if (visibility === 0) smoothed = null;
    status.textContent = hands.length === 1 ? "Montre ta deuxième main" : "Montre tes deux mains en forme de L";
  }
  if (smoothed && visibility > 0) drawFramedEffect(smoothed, visibility);

  if (showDebug) {
    ctx.fillStyle = "#0f0";
    for (const lm of hands) for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 4, 0, 7); ctx.fill(); }
  }
}
</script>
</body>
</html>
