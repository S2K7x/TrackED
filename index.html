<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>TrackED</title>
<!-- warm up connections to the CDNs used for the library, the WASM runtime and the model -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
<link rel="modulepreload" href="src/main.js" />
<style>
  :root { --bg:#000; --fg:#fff; --accent:#ff2d55; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui, -apple-system, sans-serif; overflow:hidden; overscroll-behavior:none; }
  #out, #debug-layer { position:fixed; inset:0; width:100%; height:100%; }
  #out { object-fit:contain; touch-action:none; }
  #debug-layer { pointer-events:none; }
  video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
    background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  #ui::-webkit-scrollbar { display:none; }
  #ui button, #ui label { flex:0 0 auto; border:1px solid rgba(255,255,255,.4); background:rgba(0,0,0,.45);
    color:#fff; padding:10px 14px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; }
  #ui button.on { background:var(--accent); border-color:var(--accent); }
  #ui input[type=file] { display:none; }
  #status { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:16px; right:16px; text-align:center;
    font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; }
  #start { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; gap:16px; align-items:center;
    justify-content:center; padding:16px; text-align:center; background:#000; }
  #start p { max-width:340px; opacity:.8; margin:0; }
  #start button { font:inherit; font-size:18px; padding:14px 28px; border-radius:999px; border:0;
    background:var(--accent); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div id="start">
  <h1 style="margin:0">TrackED</h1>
  <p>Fais un « L » avec le pouce et l'index de chaque main, face caméra :
  un cadre filtré apparaît entre tes mains. Glisse à gauche/droite pour changer d'effet.</p>
  <button id="go">Activer la caméra</button>
</div>

<canvas id="out"></canvas>
<canvas id="debug-layer" hidden></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="status"></div>

<div id="ui">
  <button data-fx="neon" class="on">Néon rouge</button>
  <button data-fx="violet">Violet</button>
  <button data-fx="jaune">Jaune</button>
  <button data-fx="invert">Négatif</button>
  <button data-fx="bw">N&amp;B</button>
  <button data-fx="glitch">Glitch</button>
  <button data-fx="image">Image</button>
  <label>📷 Choisir image<input id="file" type="file" accept="image/*"></label>
  <button id="flip">↺ Caméra</button>
  <button id="debug">Points</button>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
